[project]
name = "connect-timeout-guard-tools"
version = "0.1.0"
description = "Abort socket connections that do not complete the TCP handshake within a monotonic deadline."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
